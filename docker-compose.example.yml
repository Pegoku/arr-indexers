services:
  arr-indexers:
    image: ghcr.io/pegoku/arr-indexers:latest
    container_name: arr-indexers
    restart: unless-stopped
    ports:
      - "9697:9697"
    environment:
      ARR_INDEXERS_SITE: "dontorrent"
      DONTORENT_BASE_URL: "auto"
      DONTORENT_PROXY_SOURCE_URL: "https://donproxies.com/"
      ARR_INDEXERS_LOG_LEVEL: "INFO"
      # Optional. If set, use the same value as the Generic Torznab API key in Prowlarr.
      # ARR_INDEXERS_API_KEY: "replace-with-your-own-key"
